<svg width="1440" height="760" viewBox="0 0 1440 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .title    { font-size: 32px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #475569; }
      .panel-h  { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .h        { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .t        { font-size: 14px; font-weight: 500; fill: #334155; }
      .ref      { font-size: 13px; font-weight: 600; fill: #1d4ed8; }
      .flow     { font-size: 13px; font-weight: 700; fill: #1d4ed8; }
      .chip     { font-size: 13px; font-weight: 700; fill: #1e293b; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="760" fill="#ffffff" />

  <text x="720" y="54" text-anchor="middle" class="title">AWS Auto Security Monitor - Overview</text>
  <text x="720" y="86" text-anchor="middle" class="subtitle">Modular scanners + unified Azure pipelines + scalable Terraform platform</text>

  <!-- SECTION A: scan-resources -->
  <rect x="40" y="120" width="430" height="470" rx="18" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5" />
  <text x="70" y="162" class="panel-h">scan-resources</text>
  <text x="70" y="188" class="ref">details: scan-resources/README.md</text>

  <rect x="70" y="212" width="370" height="120" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text x="92" y="246" class="h">Active module</text>
  <text x="92" y="272" class="t">route53/scan_route53.py</text>
  <text x="92" y="296" class="t">--source aws | file | auto</text>
  <text x="92" y="318" class="t">incremental S3 pushes + timeout per domain</text>

  <rect x="70" y="350" width="370" height="98" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text x="92" y="384" class="h">Container image</text>
  <text x="92" y="410" class="t">scan-resources/route53/Dockerfile</text>
  <text x="92" y="432" class="t">tag: route53</text>

  <rect x="70" y="466" width="370" height="98" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" />
  <text x="92" y="500" class="h">Growth via template</text>
  <text x="92" y="526" class="t">scan-resources/_template/</text>
  <text x="92" y="548" class="t">copy + replace MODULE + add scanner_jobs</text>

  <!-- SECTION B: azure-pipelines -->
  <rect x="505" y="120" width="430" height="470" rx="18" fill="#f8fafc" stroke="#0ea5e9" stroke-width="2.5" />
  <text x="535" y="162" class="panel-h">azure-pipelines</text>
  <text x="535" y="188" class="ref">details: azure-pipelines/README.md</text>

  <rect x="535" y="212" width="370" height="105" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text x="557" y="246" class="h">scanners-build.yml</text>
  <text x="557" y="272" class="t">matrix build/push for all modules</text>
  <text x="557" y="294" class="t">AWS login + ECR login + docker push</text>

  <rect x="535" y="335" width="370" height="110" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text x="557" y="369" class="h">scanners-ops.yml (manual)</text>
  <text x="557" y="395" class="t">run-now | enable-schedule | disable-schedule</text>
  <text x="557" y="417" class="t">uses scripts/run-scanner.sh + scanner-schedule.sh</text>

  <rect x="535" y="463" width="370" height="101" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text x="557" y="497" class="h">infrastructure.yml</text>
  <text x="557" y="523" class="t">terraform init/plan/apply with tfplan artifact</text>
  <text x="557" y="545" class="t">backend-config + env tfvars</text>

  <!-- SECTION C: terraform-infrastructure -->
  <rect x="970" y="120" width="430" height="470" rx="18" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.5" />
  <text x="1000" y="162" class="panel-h">terraform-infrastructure</text>
  <text x="1000" y="188" class="ref">details: terraform-infrastructure/README.md</text>

  <rect x="1000" y="212" width="180" height="92" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text x="1090" y="246" text-anchor="middle" class="h">ECR</text>
  <text x="1090" y="270" text-anchor="middle" class="t">security-scan/scanners</text>

  <rect x="1190" y="212" width="180" height="92" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2" />
  <text x="1280" y="246" text-anchor="middle" class="h">ECS Fargate</text>
  <text x="1280" y="270" text-anchor="middle" class="t">task per scanner_jobs key</text>

  <rect x="1000" y="322" width="180" height="92" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
  <text x="1090" y="356" text-anchor="middle" class="h">EventBridge</text>
  <text x="1090" y="380" text-anchor="middle" class="t">schedule per scanner</text>

  <rect x="1190" y="322" width="180" height="92" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2" />
  <text x="1280" y="356" text-anchor="middle" class="h">CloudWatch</text>
  <text x="1280" y="380" text-anchor="middle" class="t">logs + failed-invocation alarms</text>

  <rect x="1000" y="432" width="180" height="92" rx="12" fill="#fce7f3" stroke="#ec4899" stroke-width="2" />
  <text x="1090" y="466" text-anchor="middle" class="h">SNS</text>
  <text x="1090" y="490" text-anchor="middle" class="t">email notifications</text>

  <rect x="1190" y="432" width="180" height="92" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
  <text x="1280" y="466" text-anchor="middle" class="h">S3 findings</text>
  <text x="1280" y="490" text-anchor="middle" class="t">incremental + final summaries</text>

  <!-- Arrows across sections -->
  <path d="M440 399 L535 264" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="486" y="316" text-anchor="middle" class="flow">build/push image</text>

  <path d="M905 264 L1000 258" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="952" y="246" text-anchor="middle" class="flow">image tag: module</text>

  <path d="M905 390 L1000 356" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="952" y="372" text-anchor="middle" class="flow">enable/disable + run-now</text>

  <path d="M1180 356 L1190 356" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M1090 304 L1090 322" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M1280 304 L1280 322" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M1280 414 L1190 478" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M1280 414 L1090 478" stroke="#f97316" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  <!-- Footer -->
  <rect x="40" y="636" width="1360" height="78" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="720" y="666" text-anchor="middle" class="ref">Scale model: add module in scan-resources/_template + add scanner_jobs entry + add module to scanners-build matrix and scanners-ops values</text>
  <text x="720" y="690" text-anchor="middle" class="ref">Shared platform stays the same: ECR, ECS cluster, EventBridge pattern, CloudWatch, SNS, S3 findings</text>
</svg>
