parameters:
  - name: moduleName
    type: string

steps:
  - checkout: self

  - bash: |
      python "scan-resources/${{ parameters.moduleName }}/scan_${{ parameters.moduleName }}.py" \
        --source file --smoke-test
    displayName: Smoke test (${{ parameters.moduleName }}, file mode)
    workingDirectory: $(Build.SourcesDirectory)

  - task: AWSShellScript@1
    displayName: Login to AWS
    inputs:
      awsCredentials: aws-security-monitor
      regionName: $(awsRegion)
      scriptType: inline
      inlineScript: |
        set -euo pipefail
        aws sts get-caller-identity
        ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
        echo "##vso[task.setvariable variable=awsAccountId]${ACCOUNT_ID}"

  - task: AWSShellScript@1
    displayName: Login to Amazon ECR
    inputs:
      awsCredentials: aws-security-monitor
      regionName: $(awsRegion)
      scriptType: inline
      inlineScript: |
        set -euo pipefail
        REGISTRY="$(awsAccountId).dkr.ecr.$(awsRegion).amazonaws.com"
        aws ecr get-login-password --region "$(awsRegion)" | docker login --username AWS --password-stdin "${REGISTRY}"
        echo "##vso[task.setvariable variable=ecrImageUri]${REGISTRY}/$(ecrRepository)"

  - task: Docker@2
    displayName: Build image (${{ parameters.moduleName }})
    inputs:
      command: build
      Dockerfile: scan-resources/${{ parameters.moduleName }}/Dockerfile
      buildContext: $(Build.SourcesDirectory)
      repository: scanners
      tags: |
        ${{ parameters.moduleName }}

  - task: AWSShellScript@1
    displayName: Push image to ECR (${{ parameters.moduleName }})
    inputs:
      awsCredentials: aws-security-monitor
      regionName: $(awsRegion)
      scriptType: inline
      inlineScript: |
        set -euo pipefail
        MODULE="${{ parameters.moduleName }}"
        docker tag "scanners:${MODULE}" "$(ecrImageUri):${MODULE}"
        docker push "$(ecrImageUri):${MODULE}"
        echo "Pushed $(ecrImageUri):${MODULE}"
