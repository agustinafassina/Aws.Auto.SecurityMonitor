trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: aws-security-monitor-dev

parameters:
  - name: action
    displayName: Action
    type: string
    default: run-now
    values:
      - run-now
      - enable-schedule
      - disable-schedule

steps:
  - template: ../templates/module-ops-steps.yml
    parameters:
      moduleName: route53
      ecsTaskFamily: $(ECS_TASK_FAMILY_ROUTE53)
      eventBridgeRuleName: $(EVENTBRIDGE_RULE_ROUTE53)
      action: ${{ parameters.action }}
