trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform-infrastructure/*

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: aws-security-monitor-dev
  - name: terraformVersion
    value: 1.10.0

stages:
  - stage: Plan
    jobs:
      - job: TerraformPlan
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)

          - task: AWSShellScript@1
            displayName: Terraform init and plan
            inputs:
              awsCredentials: aws-security-monitor
              regionName: $(awsRegion)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                cd terraform-infrastructure
                terraform init -input=false -backend-config="$(backendConfigFile)"
                terraform plan -input=false \
                  -var-file="$(tfVarsFile)" \
                  -out=tfplan
                echo "--- Plan summary ---"
                terraform show -no-color tfplan | tail -n 30

          - publish: $(Build.SourcesDirectory)/terraform-infrastructure/tfplan
            artifact: tfplan
            displayName: Publish plan artifact

  - stage: Apply
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - deployment: TerraformApply
        environment: security-monitor-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(terraformVersion)

                - download: current
                  artifact: tfplan

                - task: AWSShellScript@1
                  displayName: Terraform apply (saved plan)
                  inputs:
                    awsCredentials: aws-security-monitor
                    regionName: $(awsRegion)
                    scriptType: inline
                    inlineScript: |
                      set -euo pipefail
                      cd terraform-infrastructure
                      terraform init -input=false -backend-config="$(backendConfigFile)"
                      cp "$(Pipeline.Workspace)/tfplan/tfplan" ./tfplan
                      terraform apply -input=false ./tfplan
